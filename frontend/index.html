<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Movie Review Hub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: white;
    }

    header {
      background-color: #1f1f1f;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 { margin: 0; }

    button {
      padding: 0.6rem 1rem;
      border: none;
      border-radius: 6px;
      background-color: #e50914;
      color: white;
      cursor: pointer;
    }

    button:hover { opacity: 0.9; }

    input, textarea, select {
      width: 100%;
      padding: 0.7rem;
      margin-top: 0.5rem;
      margin-bottom: 1rem;
      border-radius: 6px;
      border: 1px solid #333;
      background-color: #1e1e1e;
      color: white;
    }

    .container { padding: 2rem; }

    .search-bar {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.5rem;
    }

    .movie-card {
      background-color: #1d1d1d;
      border-radius: 10px;
      padding: 1rem;
      text-align: center;
    }

    .movie-card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      border-radius: 8px;
    }

    .hidden {
      display: none !important;
    }

    .auth-box {
      max-width: 400px;
      margin-bottom: 2rem;
      background-color: #1d1d1d;
      padding: 1.5rem;
      border-radius: 10px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background-color: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .modal-content {
      background-color: #1d1d1d;
      padding: 2rem;
      border-radius: 18px;
      width: 100%;
      max-width: 820px;
      max-height: 88vh;
      overflow-y: auto;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background-color: #2a2a2a;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
    }

    .movie-header {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .movie-header img {
      width: 180px;
      height: 270px;
      object-fit: cover;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .movie-meta {
      flex: 1;
    }

    .movie-meta h2 {
      margin-top: 0;
      margin-bottom: 0.5rem;
    }

    .movie-meta .meta-row {
      color: #bbb;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }

    .movie-meta .rating {
      color: #ffd700;
      font-weight: bold;
    }

    .genre-pill {
      display: inline-block;
      background-color: #2a2a2a;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      margin-right: 0.4rem;
      font-size: 0.85rem;
    }

    .synopsis {
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .trailer-wrap {
      position: relative;
      padding-top: 56.25%;
      margin-bottom: 1.5rem;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }

    .trailer-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .cast-strip {
      display: flex;
      gap: 0.8rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .cast-card {
      flex-shrink: 0;
      width: 100px;
      text-align: center;
      font-size: 0.85rem;
    }

    .cast-card img {
      width: 100px;
      height: 130px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 0.4rem;
    }

    .cast-card .actor-name {
      font-weight: bold;
    }

    .cast-card .character-name {
      color: #aaa;
      font-size: 0.8rem;
    }

    .section-title {
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
      border-bottom: 1px solid #333;
      padding-bottom: 0.3rem;
    }

    .review {
      border-top: 1px solid #333;
      padding: 1rem 0;
    }

    .review-meta {
      color: #aaa;
      font-size: 0.85rem;
      margin-bottom: 0.3rem;
    }

    .my-review-existing {
      background-color: #2a2a2a;
      padding: 1rem;
      border-radius: 12px;
      margin-bottom: 1rem;
    }

    .my-review-actions {
      margin-top: 0.6rem;
    }

    .my-review-actions button {
      margin-right: 0.5rem;
      background-color: #444;
    }

    .my-review-actions button.danger {
      background-color: #8b1f1f;
    }

    /* Profile page */
    .profile-card {
      display: flex;
      gap: 1rem;
      background-color: #1d1d1d;
      padding: 1rem;
      border-radius: 12px;
      margin-bottom: 1rem;
      cursor: pointer;
    }

    .profile-card:hover {
      background-color: #232323;
    }

    .profile-card img {
      width: 90px;
      height: 135px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .profile-card .profile-info {
      flex: 1;
    }

    .profile-card h3 {
      margin: 0 0 0.3rem 0;
    }

    .profile-card .profile-meta {
      color: #aaa;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
    }

    .profile-card .profile-rating {
      color: #ffd700;
      font-weight: bold;
    }

    .error-msg {
      color: #ff6b6b;
      margin-top: 0.5rem;
    }

    .user-greeting {
      margin-right: 1rem;
    }
  </style>
</head>

<body>

<header>
  <h1 id="brandTitle" style="cursor:pointer;">Movie Review Hub</h1>
  <div>
    <span id="userGreeting" class="user-greeting hidden"></span>
    <button id="homeBtn">Home</button>
    <button id="profileBtn" class="hidden">My Reviews</button>
    <button id="loginBtn">Login</button>
    <button id="registerBtn">Register</button>
    <button id="logoutBtn" class="hidden">Logout</button>
  </div>
</header>

<div class="container">

  <!-- AUTH -->
  <div id="authSection" class="auth-box hidden">
    <h2 id="authTitle">Login</h2>

    <input type="text" id="username" placeholder="Username" class="hidden"/>
    <input type="email" id="email" placeholder="Email"/>
    <input type="password" id="password" placeholder="Password"/>

    <small id="passwordHint" class="hidden" style="display:block; color:#aaa; margin-top:-0.5rem; margin-bottom:1rem;">
      Min 8 characters with uppercase, lowercase, a number, and a special character.
    </small>

    <button id="authSubmitBtn">Submit</button>
    <div id="authError" class="error-msg"></div>
  </div>

  <!-- HOME VIEW -->
  <div id="homeView">
    <!-- SEARCH -->
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search movies..."/>
      <button id="searchBtn">Search</button>
    </div>

    <h2 id="gridHeading" style="margin: 0 0 1rem 0;">Trending This Week</h2>

    <!-- MOVIES -->
    <div id="movies" class="movie-grid"></div>

    <div style="text-align:center; margin-top:1.5rem;">
      <button id="loadMoreBtn" class="hidden">Load More</button>
    </div>
  </div>

  <!-- PROFILE VIEW -->
  <div id="profileView" class="hidden">
    <h2>My Reviews</h2>
    <div id="myReviews"></div>
  </div>

</div>

<!-- MODAL -->
<div id="movieModal" class="modal hidden">
  <div class="modal-content" id="modalContent">

    <button id="closeModalBtn" class="modal-close">Close</button>

    <div id="movieDetails"></div>

    <h3 class="section-title">Community Reviews</h3>
    <div id="reviews"></div>

    <h3 class="section-title">My Review</h3>

    <div id="myReviewExisting" class="hidden"></div>

    <div id="reviewForm" class="hidden">
      <select id="rating"></select>

      <textarea id="comment" placeholder="Write your review of this movie..."></textarea>

      <button id="submitReviewBtn">Save</button>
      <button id="cancelEditBtn" class="hidden" style="margin-left:0.5rem; background-color:#444;">Cancel</button>
      <div id="reviewError" class="error-msg"></div>
    </div>

    <div id="loginPrompt" class="hidden" style="margin-top:1rem; color:#aaa;">
      Login to leave a review.
    </div>

  </div>
</div>

<script>

// API base — auto-detects local development vs deployed.
// AFTER DEPLOYING THE GATEWAY: replace the placeholder below with your
// real Render gateway URL (e.g. "https://my-gateway.onrender.com").
const PROD_API_BASE = "https://itri615microservice-1.onrender.com";
const isLocal = location.hostname === "localhost" || location.hostname === "127.0.0.1";
const API_BASE = isLocal ? "http://localhost:8080" : PROD_API_BASE;

let currentMovie = null;     // full movie object from /movies/:id
let myReviewForCurrent = null; // user's existing review for the current movie (or null)
let editingReview = false;
let authMode = "login";

// Home grid pagination state
let feedMode    = "trending"; // "trending" | "search"
let feedQuery   = "";
let feedPage    = 1;
let feedTotalPages = 1;

// ============================================================
// SAFE RENDERING HELPERS
// Using textContent / createElement avoids HTML injection (XSS)
// when displaying user-supplied content like reviews or titles.
// ============================================================
function el(tag, opts = {}) {
  const node = document.createElement(tag);
  if (opts.text != null) node.textContent = opts.text;
  if (opts.className) node.className = opts.className;
  if (opts.attrs) {
    for (const [k, v] of Object.entries(opts.attrs)) node.setAttribute(k, v);
  }
  return node;
}

function clear(node) {
  while (node.firstChild) node.removeChild(node.firstChild);
}

// ============================================================
// AUTH STATE
// ============================================================
function getToken() {
  return localStorage.getItem("token");
}

function getUser() {
  const raw = localStorage.getItem("user");
  return raw ? JSON.parse(raw) : null;
}

// ============================================================
// MODAL
// ============================================================
function closeModal() {
  document.getElementById("movieModal").classList.add("hidden");
  currentMovie = null;
  myReviewForCurrent = null;
  editingReview = false;
}

// ============================================================
// AUTH UI STATE
// ============================================================
function applyAuthState() {
  const user = getUser();
  const loginBtn    = document.getElementById("loginBtn");
  const registerBtn = document.getElementById("registerBtn");
  const logoutBtn   = document.getElementById("logoutBtn");
  const greeting    = document.getElementById("userGreeting");
  const authSection = document.getElementById("authSection");

  const profileBtn = document.getElementById("profileBtn");

  if (user) {
    loginBtn.classList.add("hidden");
    registerBtn.classList.add("hidden");
    logoutBtn.classList.remove("hidden");
    profileBtn.classList.remove("hidden");
    greeting.textContent = `Hi, ${user.username}`;
    greeting.classList.remove("hidden");
    authSection.classList.add("hidden");
  } else {
    loginBtn.classList.remove("hidden");
    registerBtn.classList.remove("hidden");
    logoutBtn.classList.add("hidden");
    profileBtn.classList.add("hidden");
    greeting.textContent = "";
    greeting.classList.add("hidden");
    // Force back to home view if user logs out while on profile
    showHomeView();
  }

  applyReviewFormVisibility();
}

// ============================================================
// VIEW SWITCHING
// ============================================================
function showHomeView({ resetFeed = false } = {}) {
  document.getElementById("homeView").classList.remove("hidden");
  document.getElementById("profileView").classList.add("hidden");
  if (resetFeed) {
    document.getElementById("searchInput").value = "";
    loadPopular();
  }
}

function showProfileView() {
  document.getElementById("homeView").classList.add("hidden");
  document.getElementById("profileView").classList.remove("hidden");
  loadMyReviews();
}

function setAuthError(msg) {
  document.getElementById("authError").textContent = msg || "";
}

function clearAuthForm() {
  document.getElementById("username").value = "";
  document.getElementById("email").value    = "";
  document.getElementById("password").value = "";
  setAuthError("");
}

// ============================================================
// LOGIN / REGISTER / LOGOUT
// ============================================================
async function login() {
  setAuthError("");
  const email    = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    setAuthError("Email and password are required");
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();

    if (!res.ok) {
      setAuthError(data.error || "Login failed");
      return;
    }

    localStorage.setItem("token", data.token);
    localStorage.setItem("user",  JSON.stringify(data.user));
    clearAuthForm();
    applyAuthState();
  } catch (err) {
    setAuthError("Network error — is the gateway running?");
  }
}

// Mirrors the server-side rule in routes/auth.js — defence in depth.
const PASSWORD_PATTERN = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,72}$/;
const USERNAME_PATTERN = /^[A-Za-z0-9]{3,50}$/;

async function register() {
  setAuthError("");
  const username = document.getElementById("username").value.trim();
  const email    = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!username || !email || !password) {
    setAuthError("Username, email, and password are required");
    return;
  }

  if (!USERNAME_PATTERN.test(username)) {
    setAuthError("Username must be 3-50 characters, letters and numbers only");
    return;
  }

  if (!PASSWORD_PATTERN.test(password)) {
    setAuthError("Password must be 8-72 chars and include uppercase, lowercase, a number, and a special character");
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/auth/register`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, email, password }),
    });
    const data = await res.json();

    if (!res.ok) {
      setAuthError(data.error || "Registration failed");
      return;
    }

    localStorage.setItem("token", data.token);
    localStorage.setItem("user",  JSON.stringify(data.user));
    clearAuthForm();
    applyAuthState();
  } catch (err) {
    setAuthError("Network error — is the gateway running?");
  }
}

function logout() {
  localStorage.removeItem("token");
  localStorage.removeItem("user");
  applyAuthState();
}

// ============================================================
// MOVIES — real TMDB data via the gateway
// ============================================================
const TMDB_IMG_BASE  = "https://image.tmdb.org/t/p/w500";
const POSTER_PLACEHOLDER = "https://placehold.co/300x450?text=No+Image";

function posterUrl(movie) {
  return movie.poster_path ? `${TMDB_IMG_BASE}${movie.poster_path}` : POSTER_PLACEHOLDER;
}

function renderMovies(movies, append = false) {
  const container = document.getElementById("movies");
  if (!append) clear(container);

  if (!movies.length && !append) {
    container.appendChild(el("p", { text: "No movies found." }));
    return;
  }

  movies.forEach(movie => {
    const card = el("div", { className: "movie-card" });

    const img = el("img", { attrs: { src: posterUrl(movie), alt: movie.title || "" } });
    card.appendChild(img);

    // textContent prevents HTML/script injection from movie titles.
    card.appendChild(el("h3", { text: movie.title || "Untitled" }));

    const btn = el("button", { text: "View Reviews" });
    btn.addEventListener("click", () => openMovie(movie.id));
    card.appendChild(btn);

    container.appendChild(card);
  });
}

function setHeading(text) {
  document.getElementById("gridHeading").textContent = text;
}

function updateLoadMoreBtn() {
  const btn = document.getElementById("loadMoreBtn");
  if (feedPage < feedTotalPages) btn.classList.remove("hidden");
  else btn.classList.add("hidden");
}

async function fetchFeedPage(page) {
  if (feedMode === "search") {
    return fetch(`${API_BASE}/movies/search?query=${encodeURIComponent(feedQuery)}&page=${page}`);
  }
  return fetch(`${API_BASE}/movies/popular?page=${page}`);
}

async function loadFeed(append = false) {
  try {
    const res = await fetchFeedPage(feedPage);
    const data = await res.json();
    feedTotalPages = data.total_pages || 1;
    renderMovies(Array.isArray(data.results) ? data.results : [], append);
    updateLoadMoreBtn();
  } catch (err) {
    const container = document.getElementById("movies");
    if (!append) {
      clear(container);
      container.appendChild(el("p", { text: "Could not load movies. Is the gateway running?" }));
    }
    document.getElementById("loadMoreBtn").classList.add("hidden");
  }
}

async function loadPopular() {
  feedMode = "trending";
  feedQuery = "";
  feedPage = 1;
  setHeading("Trending This Week");
  await loadFeed(false);
}

async function searchMovies() {
  const query = document.getElementById("searchInput").value.trim();

  if (!query) {
    loadPopular();
    return;
  }

  feedMode = "search";
  feedQuery = query;
  feedPage = 1;
  setHeading(`Results for "${query}"`);
  await loadFeed(false);
}

async function loadMoreMovies() {
  if (feedPage >= feedTotalPages) return;
  feedPage += 1;
  await loadFeed(true);
}
// ============================================================
// MOVIE DETAILS MODAL
// ============================================================
const TMDB_PROFILE_BASE = "https://image.tmdb.org/t/p/w185";

function pickTrailer(videos) {
  if (!videos || !Array.isArray(videos.results)) return null;
  return videos.results.find(v =>
    v.site === "YouTube" && (v.type === "Trailer" || v.type === "Teaser")
  );
}

function renderMovieDetails(movie) {
  const root = document.getElementById("movieDetails");
  clear(root);

  // Header: poster + meta
  const header = el("div", { className: "movie-header" });

  const poster = el("img", {
    attrs: {
      src: movie.poster_path ? `${TMDB_IMG_BASE}${movie.poster_path}` : POSTER_PLACEHOLDER,
      alt: movie.title || "",
    },
  });
  header.appendChild(poster);

  const meta = el("div", { className: "movie-meta" });
  meta.appendChild(el("h2", { text: movie.title || "Untitled" }));

  const year = movie.release_date ? movie.release_date.slice(0, 4) : "";
  const runtime = movie.runtime ? `${movie.runtime} min` : "";
  const ratingText = movie.vote_average
    ? `⭐ ${Number(movie.vote_average).toFixed(1)}/10`
    : "No rating";

  const metaParts = [year, runtime].filter(Boolean).join(" • ");
  if (metaParts) meta.appendChild(el("div", { className: "meta-row", text: metaParts }));

  meta.appendChild(el("div", { className: "meta-row rating", text: ratingText }));

  if (Array.isArray(movie.genres) && movie.genres.length) {
    const genreRow = el("div", { className: "meta-row" });
    movie.genres.forEach(g => {
      genreRow.appendChild(el("span", { className: "genre-pill", text: g.name }));
    });
    meta.appendChild(genreRow);
  }

  header.appendChild(meta);
  root.appendChild(header);

  // Synopsis
  if (movie.overview) {
    root.appendChild(el("p", { className: "synopsis", text: movie.overview }));
  }

  // Trailer
  const trailer = pickTrailer(movie.videos);
  if (trailer && /^[A-Za-z0-9_-]{6,15}$/.test(trailer.key)) {
    const wrap = el("div", { className: "trailer-wrap" });
    const iframe = el("iframe", {
      attrs: {
        src: `https://www.youtube-nocookie.com/embed/${trailer.key}`,
        title: "Trailer",
        allow: "accelerometer; encrypted-media; picture-in-picture",
        referrerpolicy: "strict-origin-when-cross-origin",
        allowfullscreen: "",
      },
    });
    wrap.appendChild(iframe);
    root.appendChild(wrap);
  }

  // Cast
  if (movie.credits && Array.isArray(movie.credits.cast) && movie.credits.cast.length) {
    root.appendChild(el("h3", { className: "section-title", text: "Top Cast" }));
    const strip = el("div", { className: "cast-strip" });

    movie.credits.cast.slice(0, 8).forEach(actor => {
      const card = el("div", { className: "cast-card" });
      const photo = el("img", {
        attrs: {
          src: actor.profile_path
            ? `${TMDB_PROFILE_BASE}${actor.profile_path}`
            : "https://placehold.co/100x130?text=%3F",
          alt: actor.name || "",
        },
      });
      card.appendChild(photo);
      card.appendChild(el("div", { className: "actor-name", text: actor.name || "" }));
      if (actor.character) {
        card.appendChild(el("div", { className: "character-name", text: actor.character }));
      }
      strip.appendChild(card);
    });

    root.appendChild(strip);
  }
}

async function openMovie(id) {
  const modal = document.getElementById("movieModal");
  const details = document.getElementById("movieDetails");
  const reviewsDiv = document.getElementById("reviews");

  clear(details);
  details.appendChild(el("p", { text: "Loading movie..." }));
  clear(reviewsDiv);
  document.getElementById("myReviewExisting").classList.add("hidden");
  setReviewError("");
  editingReview = false;

  modal.classList.remove("hidden");

  try {
    const res = await fetch(`${API_BASE}/movies/${encodeURIComponent(id)}`);
    const data = await res.json();
    currentMovie = data;
    renderMovieDetails(data);
  } catch (err) {
    clear(details);
    details.appendChild(el("p", { text: "Could not load movie details." }));
    return;
  }

  loadCommunityReviews(id);
  loadMyReview(id);
}

// ============================================================
// COMMUNITY REVIEWS (from TMDB)
// ============================================================
async function loadCommunityReviews(movieId) {
  const div = document.getElementById("reviews");
  clear(div);

  try {
    const res = await fetch(`${API_BASE}/movies/${encodeURIComponent(movieId)}/reviews`);
    const data = await res.json();
    const results = Array.isArray(data.results) ? data.results : [];

    if (!results.length) {
      div.appendChild(el("p", { text: "No community reviews yet for this movie." }));
      return;
    }

    results.forEach(r => {
      const item = el("div", { className: "review" });
      const author = r.author_details?.username || r.author || "Anonymous";
      const score  = r.author_details?.rating != null ? `⭐ ${r.author_details.rating}/10 • ` : "";
      const date   = r.created_at ? new Date(r.created_at).toLocaleDateString() : "";
      item.appendChild(el("div", {
        className: "review-meta",
        text: `${score}${author}${date ? ` • ${date}` : ""}`,
      }));
      // textContent neutralises any HTML/script in the review body.
      item.appendChild(el("p", { text: r.content || "" }));
      div.appendChild(item);
    });
  } catch (err) {
    div.appendChild(el("p", { text: "Could not load community reviews." }));
  }
}

// ============================================================
// MY PRIVATE REVIEW (for the currently open movie)
// ============================================================
async function loadMyReview(movieId) {
  myReviewForCurrent = null;
  const token = getToken();
  if (!token) {
    applyReviewFormVisibility();
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/reviews/me/${encodeURIComponent(movieId)}`, {
      headers: { "Authorization": `Bearer ${token}` },
    });
    if (res.ok) {
      myReviewForCurrent = await res.json();
    }
  } catch (err) {
    // network error — leave myReviewForCurrent null
  }
  applyReviewFormVisibility();
}

function renderMyReviewExisting() {
  const wrap = document.getElementById("myReviewExisting");
  clear(wrap);
  wrap.classList.remove("my-review-existing");
  if (!myReviewForCurrent) {
    wrap.classList.add("hidden");
    return;
  }
  wrap.classList.remove("hidden");
  wrap.classList.add("my-review-existing");

  const date = myReviewForCurrent.created_at
    ? new Date(myReviewForCurrent.created_at).toLocaleDateString()
    : "";
  wrap.appendChild(el("div", {
    className: "review-meta",
    text: `⭐ ${myReviewForCurrent.rating}/10${date ? ` • ${date}` : ""}`,
  }));
  if (myReviewForCurrent.body) {
    wrap.appendChild(el("p", { text: myReviewForCurrent.body }));
  }

  const actions = el("div", { className: "my-review-actions" });

  const editBtn = el("button", { text: "Edit" });
  editBtn.addEventListener("click", startEditMyReview);
  actions.appendChild(editBtn);

  const delBtn = el("button", { text: "Delete" });
  delBtn.classList.add("danger");
  delBtn.addEventListener("click", deleteMyReview);
  actions.appendChild(delBtn);

  wrap.appendChild(actions);
}

function startEditMyReview() {
  if (!myReviewForCurrent) return;
  editingReview = true;
  document.getElementById("rating").value = myReviewForCurrent.rating;
  document.getElementById("comment").value = myReviewForCurrent.body || "";
  document.getElementById("submitReviewBtn").textContent = "Update";
  document.getElementById("cancelEditBtn").classList.remove("hidden");
  document.getElementById("reviewForm").classList.remove("hidden");
  document.getElementById("myReviewExisting").classList.add("hidden");
}

function cancelEditMyReview() {
  editingReview = false;
  document.getElementById("rating").value = 1;
  document.getElementById("comment").value = "";
  document.getElementById("submitReviewBtn").textContent = "Save";
  document.getElementById("cancelEditBtn").classList.add("hidden");
  setReviewError("");
  applyReviewFormVisibility();
}

async function deleteMyReview() {
  const token = getToken();
  if (!token || !myReviewForCurrent) return;
  if (!confirm("Delete this review?")) return;

  try {
    const res = await fetch(`${API_BASE}/reviews/${myReviewForCurrent.id}`, {
      method: "DELETE",
      headers: { "Authorization": `Bearer ${token}` },
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      setReviewError(data.error || "Could not delete review");
      return;
    }
    myReviewForCurrent = null;
    applyReviewFormVisibility();
  } catch (err) {
    setReviewError("Network error. Try again.");
  }
}

function applyReviewFormVisibility() {
  const loggedIn = !!getToken();
  const form     = document.getElementById("reviewForm");
  const prompt   = document.getElementById("loginPrompt");
  const existing = document.getElementById("myReviewExisting");

  prompt.classList.toggle("hidden", loggedIn);

  if (!loggedIn) {
    form.classList.add("hidden");
    existing.classList.add("hidden");
    return;
  }

  if (myReviewForCurrent && !editingReview) {
    // User already reviewed this movie — show their saved review, hide the form
    renderMyReviewExisting();
    form.classList.add("hidden");
  } else {
    // No review yet, or actively editing — show the form
    existing.classList.add("hidden");
    form.classList.remove("hidden");
    if (!editingReview) {
      document.getElementById("submitReviewBtn").textContent = "Save";
      document.getElementById("cancelEditBtn").classList.add("hidden");
    }
  }
}

function setReviewError(msg) {
  document.getElementById("reviewError").textContent = msg || "";
}

async function submitReview() {
  setReviewError("");
  const token = getToken();
  if (!token) {
    setReviewError("You must be logged in to submit a review.");
    return;
  }
  if (!currentMovie) {
    setReviewError("No movie selected.");
    return;
  }

  const rating  = Number(document.getElementById("rating").value);
  const comment = document.getElementById("comment").value.trim();

  if (comment && (comment.length < 3 || comment.length > 500)) {
    setReviewError("Comment must be 3-500 characters.");
    return;
  }

  try {
    let res, data;
    if (editingReview && myReviewForCurrent) {
      res = await fetch(`${API_BASE}/reviews/${myReviewForCurrent.id}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`,
        },
        body: JSON.stringify({ rating, comment }),
      });
    } else {
      res = await fetch(`${API_BASE}/reviews`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`,
        },
        body: JSON.stringify({
          movieId: currentMovie.id,
          movieTitle: currentMovie.title,
          moviePosterPath: currentMovie.poster_path || null,
          rating,
          comment,
        }),
      });
    }
    data = await res.json();

    if (!res.ok) {
      const msg = typeof data.error === "string"
        ? data.error
        : (Array.isArray(data.error) ? data.error[0]?.msg : "Could not save review");
      setReviewError(msg);
      return;
    }

    myReviewForCurrent = data;
    editingReview = false;
    document.getElementById("comment").value = "";
    document.getElementById("rating").value = 1;
    applyReviewFormVisibility();
  } catch (err) {
    setReviewError("Network error. Try again.");
  }
}

// ============================================================
// PROFILE PAGE — list of all the current user's reviews
// ============================================================
async function loadMyReviews() {
  const token = getToken();
  const div = document.getElementById("myReviews");
  clear(div);

  if (!token) {
    div.appendChild(el("p", { text: "Login to view your reviews." }));
    return;
  }

  div.appendChild(el("p", { text: "Loading..." }));

  try {
    const res = await fetch(`${API_BASE}/reviews/me`, {
      headers: { "Authorization": `Bearer ${token}` },
    });
    const data = await res.json();

    clear(div);

    if (!Array.isArray(data) || !data.length) {
      div.appendChild(el("p", { text: "You haven't reviewed any movies yet." }));
      return;
    }

    data.forEach(r => {
      const card = el("div", { className: "profile-card" });

      const poster = el("img", {
        attrs: {
          src: r.movie_poster_path ? `${TMDB_IMG_BASE}${r.movie_poster_path}` : POSTER_PLACEHOLDER,
          alt: r.movie_title || "",
        },
      });
      card.appendChild(poster);

      const info = el("div", { className: "profile-info" });
      info.appendChild(el("h3", { text: r.movie_title || "Untitled" }));

      const date = r.created_at ? new Date(r.created_at).toLocaleDateString() : "";
      info.appendChild(el("div", {
        className: "profile-meta",
        text: date,
      }));
      info.appendChild(el("div", {
        className: "profile-rating",
        text: `⭐ ${r.rating}/10`,
      }));
      if (r.body) info.appendChild(el("p", { text: r.body }));

      card.appendChild(info);
      card.addEventListener("click", () => openMovie(r.tmdb_movie_id));
      div.appendChild(card);
    });
  } catch (err) {
    clear(div);
    div.appendChild(el("p", { text: "Could not load your reviews." }));
  }
}

// ============================================================
// RATING OPTIONS (1-10)
// ============================================================
const ratingSel = document.getElementById("rating");
for (let i = 1; i <= 10; i++) {
  const opt = el("option", { text: String(i) });
  opt.value = i;
  ratingSel.appendChild(opt);
}

// EVENT BINDINGS
// (No inline onclick — avoids string-interpolation injection
//  attacks via movie titles or other dynamic content.)
// ============================================================
document.getElementById("loginBtn").addEventListener("click", () => {
  authMode = "login";
  document.getElementById("authTitle").textContent = "Login";
  document.getElementById("username").classList.add("hidden");
  document.getElementById("passwordHint").classList.add("hidden");
  document.getElementById("authSection").classList.remove("hidden");
});

document.getElementById("registerBtn").addEventListener("click", () => {
  authMode = "register";
  document.getElementById("authTitle").textContent = "Register";
  document.getElementById("username").classList.remove("hidden");
  document.getElementById("passwordHint").classList.remove("hidden");
  document.getElementById("authSection").classList.remove("hidden");
});

document.getElementById("logoutBtn").addEventListener("click", () => logout());

document.getElementById("authSubmitBtn").addEventListener("click", () => {
  if (authMode === "login") login();
  else register();
});

document.getElementById("searchBtn").addEventListener("click", () => searchMovies());

document.getElementById("searchInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") searchMovies();
});

document.getElementById("loadMoreBtn").addEventListener("click", () => loadMoreMovies());

document.getElementById("homeBtn").addEventListener("click", () => showHomeView({ resetFeed: true }));

document.getElementById("closeModalBtn").addEventListener("click", () => closeModal());

document.getElementById("submitReviewBtn").addEventListener("click", () => submitReview());

document.getElementById("cancelEditBtn").addEventListener("click", () => cancelEditMyReview());

document.getElementById("profileBtn").addEventListener("click", () => showProfileView());

document.getElementById("brandTitle").addEventListener("click", () => showHomeView({ resetFeed: true }));

document.getElementById("movieModal").addEventListener("click", (e) => {
  if (e.target.id === "movieModal") closeModal();
});

// ============================================================
// INITIAL LOAD
// ============================================================
applyAuthState();
loadPopular();

</script>
