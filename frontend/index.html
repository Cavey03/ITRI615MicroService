<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Movie Review Hub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: white;
    }

    header {
      background-color: #1f1f1f;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 { margin: 0; }

    button {
      padding: 0.6rem 1rem;
      border: none;
      border-radius: 6px;
      background-color: #e50914;
      color: white;
      cursor: pointer;
    }

    button:hover { opacity: 0.9; }

    input, textarea, select {
      width: 100%;
      padding: 0.7rem;
      margin-top: 0.5rem;
      margin-bottom: 1rem;
      border-radius: 6px;
      border: 1px solid #333;
      background-color: #1e1e1e;
      color: white;
    }

    .container { padding: 2rem; }

    .search-bar {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.5rem;
    }

    .movie-card {
      background-color: #1d1d1d;
      border-radius: 10px;
      padding: 1rem;
      text-align: center;
    }

    .movie-card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      border-radius: 8px;
    }

    .hidden {
      display: none !important;
    }

    .auth-box {
      max-width: 400px;
      margin-bottom: 2rem;
      background-color: #1d1d1d;
      padding: 1.5rem;
      border-radius: 10px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background-color: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .modal-content {
      background-color: #1d1d1d;
      padding: 2rem;
      border-radius: 18px;
      width: 100%;
      max-width: 820px;
      max-height: 88vh;
      overflow-y: auto;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background-color: #2a2a2a;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
    }

    .movie-header {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .movie-header img {
      width: 180px;
      height: 270px;
      object-fit: cover;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .movie-meta {
      flex: 1;
    }

    .movie-meta h2 {
      margin-top: 0;
      margin-bottom: 0.5rem;
    }

    .movie-meta .meta-row {
      color: #bbb;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }

    .movie-meta .rating {
      color: #ffd700;
      font-weight: bold;
    }

    .genre-pill {
      display: inline-block;
      background-color: #2a2a2a;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      margin-right: 0.4rem;
      font-size: 0.85rem;
    }

    .synopsis {
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .trailer-wrap {
      position: relative;
      padding-top: 56.25%;
      margin-bottom: 1.5rem;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }

    .trailer-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .cast-strip {
      display: flex;
      gap: 0.8rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .cast-card {
      flex-shrink: 0;
      width: 100px;
      text-align: center;
      font-size: 0.85rem;
    }

    .cast-card img {
      width: 100px;
      height: 130px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 0.4rem;
    }

    .cast-card .actor-name {
      font-weight: bold;
    }

    .cast-card .character-name {
      color: #aaa;
      font-size: 0.8rem;
    }

    .section-title {
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
      border-bottom: 1px solid #333;
      padding-bottom: 0.3rem;
    }

    .review {
      border-top: 1px solid #333;
      padding: 1rem 0;
    }

    .review-meta {
      color: #aaa;
      font-size: 0.85rem;
      margin-bottom: 0.3rem;
    }

    .error-msg {
      color: #ff6b6b;
      margin-top: 0.5rem;
    }

    .user-greeting {
      margin-right: 1rem;
    }
  </style>
</head>

<body>

<header>
  <h1>Movie Review Hub</h1>
  <div>
    <span id="userGreeting" class="user-greeting hidden"></span>
    <button id="loginBtn">Login</button>
    <button id="registerBtn">Register</button>
    <button id="logoutBtn" class="hidden">Logout</button>
  </div>
</header>

<div class="container">

  <!-- AUTH -->
  <div id="authSection" class="auth-box hidden">
    <h2 id="authTitle">Login</h2>

    <input type="text" id="username" placeholder="Username" class="hidden"/>
    <input type="email" id="email" placeholder="Email"/>
    <input type="password" id="password" placeholder="Password"/>

    <small id="passwordHint" class="hidden" style="display:block; color:#aaa; margin-top:-0.5rem; margin-bottom:1rem;">
      Min 8 characters with uppercase, lowercase, a number, and a special character.
    </small>

    <button id="authSubmitBtn">Submit</button>
    <div id="authError" class="error-msg"></div>
  </div>

  <!-- SEARCH -->
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search movies..."/>
    <button id="searchBtn">Search</button>
  </div>

  <!-- MOVIES -->
  <div id="movies" class="movie-grid"></div>

</div>

<!-- MODAL -->
<div id="movieModal" class="modal hidden">
  <div class="modal-content" id="modalContent">

    <button id="closeModalBtn" class="modal-close">Close</button>

    <div id="movieDetails"></div>

    <h3 class="section-title">Reviews</h3>
    <div id="reviews"></div>

    <div id="reviewForm" class="hidden">
      <h3 class="section-title">Leave a Review</h3>

      <select id="rating"></select>

      <textarea id="comment" placeholder="Write review..."></textarea>

      <button id="submitReviewBtn">Submit</button>
      <div id="reviewError" class="error-msg"></div>
    </div>

    <div id="loginPrompt" class="hidden" style="margin-top:1rem; color:#aaa;">
      Login to leave a review.
    </div>

  </div>
</div>

<script>

const API_BASE = "http://localhost:8080";

let currentMovieId = null;
let authMode = "login";

// ============================================================
// SAFE RENDERING HELPERS
// Using textContent / createElement avoids HTML injection (XSS)
// when displaying user-supplied content like reviews or titles.
// ============================================================
function el(tag, opts = {}) {
  const node = document.createElement(tag);
  if (opts.text != null) node.textContent = opts.text;
  if (opts.className) node.className = opts.className;
  if (opts.attrs) {
    for (const [k, v] of Object.entries(opts.attrs)) node.setAttribute(k, v);
  }
  return node;
}

function clear(node) {
  while (node.firstChild) node.removeChild(node.firstChild);
}

// ============================================================
// AUTH STATE
// ============================================================
function getToken() {
  return localStorage.getItem("token");
}

function getUser() {
  const raw = localStorage.getItem("user");
  return raw ? JSON.parse(raw) : null;
}

// ============================================================
// MODAL
// ============================================================
function closeModal() {
  document.getElementById("movieModal").classList.add("hidden");
  currentMovieId = null;
}

// ============================================================
// AUTH UI STATE
// ============================================================
function applyAuthState() {
  const user = getUser();
  const loginBtn    = document.getElementById("loginBtn");
  const registerBtn = document.getElementById("registerBtn");
  const logoutBtn   = document.getElementById("logoutBtn");
  const greeting    = document.getElementById("userGreeting");
  const authSection = document.getElementById("authSection");

  if (user) {
    loginBtn.classList.add("hidden");
    registerBtn.classList.add("hidden");
    logoutBtn.classList.remove("hidden");
    greeting.textContent = `Hi, ${user.username}`;
    greeting.classList.remove("hidden");
    authSection.classList.add("hidden");
  } else {
    loginBtn.classList.remove("hidden");
    registerBtn.classList.remove("hidden");
    logoutBtn.classList.add("hidden");
    greeting.textContent = "";
    greeting.classList.add("hidden");
  }

  applyReviewFormVisibility();
}

function setAuthError(msg) {
  document.getElementById("authError").textContent = msg || "";
}

function clearAuthForm() {
  document.getElementById("username").value = "";
  document.getElementById("email").value    = "";
  document.getElementById("password").value = "";
  setAuthError("");
}

// ============================================================
// LOGIN / REGISTER / LOGOUT
// ============================================================
async function login() {
  setAuthError("");
  const email    = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    setAuthError("Email and password are required");
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();

    if (!res.ok) {
      setAuthError(data.error || "Login failed");
      return;
    }

    localStorage.setItem("token", data.token);
    localStorage.setItem("user",  JSON.stringify(data.user));
    clearAuthForm();
    applyAuthState();
  } catch (err) {
    setAuthError("Network error — is the gateway running?");
  }
}

// Mirrors the server-side rule in routes/auth.js — defence in depth.
const PASSWORD_PATTERN = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,72}$/;
const USERNAME_PATTERN = /^[A-Za-z0-9]{3,50}$/;

async function register() {
  setAuthError("");
  const username = document.getElementById("username").value.trim();
  const email    = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!username || !email || !password) {
    setAuthError("Username, email, and password are required");
    return;
  }

  if (!USERNAME_PATTERN.test(username)) {
    setAuthError("Username must be 3-50 characters, letters and numbers only");
    return;
  }

  if (!PASSWORD_PATTERN.test(password)) {
    setAuthError("Password must be 8-72 chars and include uppercase, lowercase, a number, and a special character");
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/auth/register`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, email, password }),
    });
    const data = await res.json();

    if (!res.ok) {
      setAuthError(data.error || "Registration failed");
      return;
    }

    localStorage.setItem("token", data.token);
    localStorage.setItem("user",  JSON.stringify(data.user));
    clearAuthForm();
    applyAuthState();
  } catch (err) {
    setAuthError("Network error — is the gateway running?");
  }
}

function logout() {
  localStorage.removeItem("token");
  localStorage.removeItem("user");
  applyAuthState();
}

// ============================================================
// MOVIES — real TMDB data via the gateway
// ============================================================
const TMDB_IMG_BASE  = "https://image.tmdb.org/t/p/w500";
const POSTER_PLACEHOLDER = "https://placehold.co/300x450?text=No+Image";

function posterUrl(movie) {
  return movie.poster_path ? `${TMDB_IMG_BASE}${movie.poster_path}` : POSTER_PLACEHOLDER;
}

function renderMovies(movies) {
  const container = document.getElementById("movies");
  clear(container);

  if (!movies.length) {
    container.appendChild(el("p", { text: "No movies found." }));
    return;
  }

  movies.forEach(movie => {
    const card = el("div", { className: "movie-card" });

    const img = el("img", { attrs: { src: posterUrl(movie), alt: movie.title || "" } });
    card.appendChild(img);

    // textContent prevents HTML/script injection from movie titles.
    card.appendChild(el("h3", { text: movie.title || "Untitled" }));

    const btn = el("button", { text: "View Reviews" });
    btn.addEventListener("click", () => openMovie(movie.id, movie.title));
    card.appendChild(btn);

    container.appendChild(card);
  });
}

async function loadPopular() {
  try {
    const res = await fetch(`${API_BASE}/movies/popular`);
    const data = await res.json();
    renderMovies(Array.isArray(data.results) ? data.results : []);
  } catch (err) {
    const container = document.getElementById("movies");
    clear(container);
    container.appendChild(el("p", { text: "Could not load movies. Is the gateway running?" }));
  }
}

async function searchMovies() {
  const query = document.getElementById("searchInput").value.trim();

  if (!query) {
    loadPopular();
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/movies/search?query=${encodeURIComponent(query)}`);
    const data = await res.json();
    renderMovies(Array.isArray(data.results) ? data.results : []);
  } catch (err) {
    const container = document.getElementById("movies");
    clear(container);
    container.appendChild(el("p", { text: "Search failed. Try again." }));
  }
}
// ============================================================
// MOVIE DETAILS MODAL
// ============================================================
const TMDB_PROFILE_BASE = "https://image.tmdb.org/t/p/w185";

function pickTrailer(videos) {
  if (!videos || !Array.isArray(videos.results)) return null;
  return videos.results.find(v =>
    v.site === "YouTube" && (v.type === "Trailer" || v.type === "Teaser")
  );
}

function renderMovieDetails(movie) {
  const root = document.getElementById("movieDetails");
  clear(root);

  // Header: poster + meta
  const header = el("div", { className: "movie-header" });

  const poster = el("img", {
    attrs: {
      src: movie.poster_path ? `${TMDB_IMG_BASE}${movie.poster_path}` : POSTER_PLACEHOLDER,
      alt: movie.title || "",
    },
  });
  header.appendChild(poster);

  const meta = el("div", { className: "movie-meta" });
  meta.appendChild(el("h2", { text: movie.title || "Untitled" }));

  const year = movie.release_date ? movie.release_date.slice(0, 4) : "";
  const runtime = movie.runtime ? `${movie.runtime} min` : "";
  const ratingText = movie.vote_average
    ? `⭐ ${Number(movie.vote_average).toFixed(1)}/10`
    : "No rating";

  const metaParts = [year, runtime].filter(Boolean).join(" • ");
  if (metaParts) meta.appendChild(el("div", { className: "meta-row", text: metaParts }));

  meta.appendChild(el("div", { className: "meta-row rating", text: ratingText }));

  if (Array.isArray(movie.genres) && movie.genres.length) {
    const genreRow = el("div", { className: "meta-row" });
    movie.genres.forEach(g => {
      genreRow.appendChild(el("span", { className: "genre-pill", text: g.name }));
    });
    meta.appendChild(genreRow);
  }

  header.appendChild(meta);
  root.appendChild(header);

  // Synopsis
  if (movie.overview) {
    root.appendChild(el("p", { className: "synopsis", text: movie.overview }));
  }

  // Trailer
  const trailer = pickTrailer(movie.videos);
  if (trailer && /^[A-Za-z0-9_-]{6,15}$/.test(trailer.key)) {
    const wrap = el("div", { className: "trailer-wrap" });
    const iframe = el("iframe", {
      attrs: {
        src: `https://www.youtube-nocookie.com/embed/${trailer.key}`,
        title: "Trailer",
        allow: "accelerometer; encrypted-media; picture-in-picture",
        referrerpolicy: "strict-origin-when-cross-origin",
        allowfullscreen: "",
      },
    });
    wrap.appendChild(iframe);
    root.appendChild(wrap);
  }

  // Cast
  if (movie.credits && Array.isArray(movie.credits.cast) && movie.credits.cast.length) {
    root.appendChild(el("h3", { className: "section-title", text: "Top Cast" }));
    const strip = el("div", { className: "cast-strip" });

    movie.credits.cast.slice(0, 8).forEach(actor => {
      const card = el("div", { className: "cast-card" });
      const photo = el("img", {
        attrs: {
          src: actor.profile_path
            ? `${TMDB_PROFILE_BASE}${actor.profile_path}`
            : "https://placehold.co/100x130?text=%3F",
          alt: actor.name || "",
        },
      });
      card.appendChild(photo);
      card.appendChild(el("div", { className: "actor-name", text: actor.name || "" }));
      if (actor.character) {
        card.appendChild(el("div", { className: "character-name", text: actor.character }));
      }
      strip.appendChild(card);
    });

    root.appendChild(strip);
  }
}

async function openMovie(id) {
  currentMovieId = id;
  const modal = document.getElementById("movieModal");
  const details = document.getElementById("movieDetails");
  const reviewsDiv = document.getElementById("reviews");

  // Loading placeholder
  clear(details);
  details.appendChild(el("p", { text: "Loading movie..." }));
  clear(reviewsDiv);

  modal.classList.remove("hidden");
  applyReviewFormVisibility();

  try {
    const res = await fetch(`${API_BASE}/movies/${encodeURIComponent(id)}`);
    const data = await res.json();
    renderMovieDetails(data);
  } catch (err) {
    clear(details);
    details.appendChild(el("p", { text: "Could not load movie details." }));
  }

  loadReviews(id);
}

async function loadReviews(movieId) {
  const div = document.getElementById("reviews");
  clear(div);

  try {
    const res = await fetch(`${API_BASE}/reviews/${encodeURIComponent(movieId)}`);
    const data = await res.json();

    if (!Array.isArray(data) || !data.length) {
      div.appendChild(el("p", { text: "No reviews yet — be the first!" }));
      return;
    }

    data.forEach(r => {
      const item = el("div", { className: "review" });
      item.appendChild(el("div", { className: "review-meta", text: `Rating: ${r.rating}/10` }));
      // textContent on the review body neutralises any HTML/script content the reviewer typed.
      item.appendChild(el("p", { text: r.body || "" }));
      div.appendChild(item);
    });
  } catch (err) {
    div.appendChild(el("p", { text: "Could not load reviews." }));
  }
}

function applyReviewFormVisibility() {
  const loggedIn = !!getToken();
  document.getElementById("reviewForm").classList.toggle("hidden", !loggedIn);
  document.getElementById("loginPrompt").classList.toggle("hidden", loggedIn);
}

function setReviewError(msg) {
  document.getElementById("reviewError").textContent = msg || "";
}

async function submitReview() {
  setReviewError("");
  const token = getToken();
  if (!token) {
    setReviewError("You must be logged in to submit a review.");
    return;
  }

  const rating  = Number(document.getElementById("rating").value);
  const comment = document.getElementById("comment").value.trim();

  if (!currentMovieId) {
    setReviewError("No movie selected.");
    return;
  }

  if (comment && (comment.length < 3 || comment.length > 500)) {
    setReviewError("Comment must be 3-500 characters.");
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/reviews`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`,
      },
      body: JSON.stringify({ movieId: currentMovieId, rating, comment }),
    });
    const data = await res.json();

    if (!res.ok) {
      const msg = typeof data.error === "string"
        ? data.error
        : (Array.isArray(data.error) ? data.error[0]?.msg : "Could not submit review");
      setReviewError(msg);
      return;
    }

    document.getElementById("comment").value = "";
    loadReviews(currentMovieId);
  } catch (err) {
    setReviewError("Network error. Try again.");
  }
}

// ============================================================
// RATING OPTIONS (1-10)
// ============================================================
const ratingSel = document.getElementById("rating");
for (let i = 1; i <= 10; i++) {
  const opt = el("option", { text: String(i) });
  opt.value = i;
  ratingSel.appendChild(opt);
}

// ============================================================
// EVENT BINDINGS
// (No inline onclick — avoids string-interpolation injection
//  attacks via movie titles or other dynamic content.)
// ============================================================
document.getElementById("loginBtn").addEventListener("click", () => {
  authMode = "login";
  document.getElementById("authTitle").textContent = "Login";
  document.getElementById("username").classList.add("hidden");
  document.getElementById("passwordHint").classList.add("hidden");
  document.getElementById("authSection").classList.remove("hidden");
});

document.getElementById("registerBtn").addEventListener("click", () => {
  authMode = "register";
  document.getElementById("authTitle").textContent = "Register";
  document.getElementById("username").classList.remove("hidden");
  document.getElementById("passwordHint").classList.remove("hidden");
  document.getElementById("authSection").classList.remove("hidden");
});

document.getElementById("logoutBtn").addEventListener("click", () => logout());

document.getElementById("authSubmitBtn").addEventListener("click", () => {
  if (authMode === "login") login();
  else register();
});

document.getElementById("searchBtn").addEventListener("click", () => searchMovies());

document.getElementById("closeModalBtn").addEventListener("click", () => closeModal());

document.getElementById("submitReviewBtn").addEventListener("click", () => submitReview());

document.getElementById("movieModal").addEventListener("click", (e) => {
  if (e.target.id === "movieModal") closeModal();
});

// ============================================================
// INITIAL LOAD
// ============================================================
applyAuthState();
loadPopular();

</script>

</body>
</html>
